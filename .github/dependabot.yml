version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      laravel:
        patterns: ['laravel/*', 'inertiajs/*']
      dev-tools:
        patterns: ['pestphp/*', 'rector/*', 'larastan/*', 'driftingly/*', 'phpstan/*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react*', '@inertiajs/*']
      radix:
        patterns: ['@radix-ui/*']
      tooling:
        patterns: ['vite*', '@vitejs/*', 'typescript', '@testing-library/*', 'jsdom']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
